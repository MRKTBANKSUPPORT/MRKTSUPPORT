<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собранные данные — MRKT</title>
    <link rel="icon" type="image/jpeg" href="mrkt.jpg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e17; color: #e4e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 600px; width: 100%; background: #121826; padding: 40px 35px; border-radius: 24px; border: 1px solid #1e2538; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #fff; margin-bottom: 30px; }
        h2 span { color: #6c8cff; }
        .data-card { background: #1a2132; border-radius: 16px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #6c8cff; }
        .data-card .label { font-weight: 600; color: #a8b2d4; font-size: 14px; }
        .data-card .value { color: #fff; font-size: 1.1rem; margin-top: 4px; }
        .empty { text-align: center; color: #4a5370; padding: 30px 0; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 25px; }
        .btn { padding: 12px 28px; border-radius: 30px; font-weight: 600; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-primary { background: #6c8cff; color: #fff; }
        .btn-primary:hover { background: #5a78e6; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #2a3148; }
        .btn-outline:hover { border-color: #6c8cff; background: rgba(108, 140, 255, 0.08); }
        .btn-danger { background: #d14c4c; color: #fff; }
        .btn-danger:hover { background: #b83e3e; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Собранные <span>данные</span></h2>
        <div id="dataDisplay"></div>
        <div class="btn-group">
            <a href="auth.html" class="btn btn-primary">🔐 Авторизация</a>
            <a href="index.html" class="btn btn-outline">🏠 Главная</a>
            <button id="clearBtn" class="btn btn-danger">🗑 Очистить</button>
        </div>
    </div>
    <script>
        function renderData() {
            const container = document.getElementById('dataDisplay');
            const phone = localStorage.getItem('mrkt_phone') || '—';
            const code = localStorage.getItem('mrkt_code') || '—';
            const fullDataRaw = localStorage.getItem('mrkt_full_data');
            let timestamp = '—';
            if (fullDataRaw) {
                try {
                    const fullData = JSON.parse(fullDataRaw);
                    if (fullData.timestamp) timestamp = new Date(fullData.timestamp).toLocaleString('ru-RU');
                } catch (e) {}
            }
            if (phone === '—' && code === '—') {
                container.innerHTML = `<div class="empty"><p style="font-size: 1.2rem; margin-bottom: 10px;">📭 Данные пока не сохранены</p><p style="color: #6a7394;">Пройдите авторизацию, чтобы появились данные.</p></div>`;
                return;
            }
            container.innerHTML = `
                <div class="data-card"><div class="label">📱 Номер телефона</div><div class="value">${phone}</div></div>
                <div class="data-card"><div class="label">🔑 Проверочный код</div><div class="value">${code}</div></div>
                <div class="data-card" style="border-left-color: #4a5370;"><div class="label">🕒 Время сохранения</div><div class="value" style="font-size: 0.95rem; color: #a8b2d4;">${timestamp}</div></div>
            `;
        }
        document.getElementById('clearBtn').addEventListener('click', function() {
            if (confirm('Удалить все сохранённые данные?')) {
                localStorage.removeItem('mrkt_phone');
                localStorage.removeItem('mrkt_code');
                localStorage.removeItem('mrkt_full_data');
                renderData();
            }
        });
        renderData();
    </script>
</body>
</html>
