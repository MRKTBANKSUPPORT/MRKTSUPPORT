<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собранные данные — MRKT BANK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7fc; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }
        h2 { text-align: center; color: #0a1e3c; margin-bottom: 30px; }
        .data-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #0a1e3c;
        }
        .data-card .label { font-weight: 600; color: #333; }
        .data-card .value { color: #0a1e3c; font-size: 1.1rem; margin-top: 4px; }
        .empty { text-align: center; color: #888; padding: 30px 0; }
        .btn {
            display: inline-block;
            background: #0a1e3c;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            margin: 5px;
        }
        .btn:hover { background: #1a3a6a; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .timestamp { color: #888; font-size: 0.85rem; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Собранные данные</h2>

    <div id="dataDisplay">
        <!-- Данные будут вставлены сюда -->
    </div>

    <div class="btn-group">
        <a href="auth.html" class="btn">🔐 Авторизация</a>
        <a href="index.html" class="btn">🏠 Главная</a>
        <button id="clearBtn" class="btn btn-danger">🗑 Очистить данные</button>
    </div>
</div>

<script>
    function renderData() {
        const container = document.getElementById('dataDisplay');

        // Получаем данные из localStorage
        const phone = localStorage.getItem('mrkt_phone') || '—';
        const code = localStorage.getItem('mrkt_code') || '—';
        const fullDataRaw = localStorage.getItem('mrkt_full_data');
        let timestamp = '—';

        if (fullDataRaw) {
            try {
                const fullData = JSON.parse(fullDataRaw);
                if (fullData.timestamp) {
                    timestamp = new Date(fullData.timestamp).toLocaleString('ru-RU');
                }
            } catch (e) {}
        }

        // Проверяем, есть ли данные
        if (phone === '—' && code === '—') {
            container.innerHTML = `
                <div class="empty">
                    <p style="font-size: 1.2rem; margin-bottom: 10px;">📭 Данные пока не сохранены</p>
                    <p>Пройдите авторизацию, чтобы появились данные.</p>
                </div>
            `;
            return;
        }

        // Отображаем данные
        container.innerHTML = `
            <div class="data-card">
                <div class="label">📱 Номер телефона</div>
                <div class="value">${phone}</div>
            </div>
            <div class="data-card">
                <div class="label">🔑 Проверочный код</div>
                <div class="value">${code}</div>
            </div>
            <div class="data-card" style="border-left-color: #888;">
                <div class="label">🕒 Время сохранения</div>
                <div class="value" style="font-size: 0.95rem; color: #555;">${timestamp}</div>
            </div>
        `;
    }

    // Очистка данных
    document.getElementById('clearBtn').addEventListener('click', function() {
        if (confirm('Удалить все сохранённые данные?')) {
            localStorage.removeItem('mrkt_phone');
            localStorage.removeItem('mrkt_code');
            localStorage.removeItem('mrkt_full_data');
            renderData();
        }
    });

    // Рендерим при загрузке
    renderData();
</script>

</body>
</html>
