<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — MRKT BANK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7fc; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-container {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }
        .auth-container h2 { text-align: center; color: #0a1e3c; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            transition: 0.2s;
        }
        .form-group input:focus { border-color: #0a1e3c; outline: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .btn-primary { background: #0a1e3c; }
        .btn-primary:hover { background: #1a3a6a; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #code-field { display: none; margin-top: 15px; }
        #message { margin-top: 18px; font-weight: 600; text-align: center; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #0a1e3c; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        .note { font-size: 13px; color: #888; text-align: center; margin-top: 18px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>🔐 Вход в MRKT BANK</h2>

    <form id="auth-form">
        <div class="form-group">
            <label for="phone">📱 Номер телефона</label>
            <input type="tel" id="phone" placeholder="+7 (XXX) XXX-XX-XX" required />
        </div>

        <button type="button" id="requestCodeBtn" class="btn btn-primary">
            📲 Запросить проверочный код
        </button>

        <div id="code-field">
            <div class="form-group">
                <label for="code">🔑 Проверочный код</label>
                <input type="text" id="code" placeholder="Введите код из SMS" />
            </div>
            <button type="submit" id="submitBtn" class="btn btn-success">
                ✅ Подтвердить
            </button>
        </div>

        <div id="message"></div>
    </form>

    <a href="index.html" class="back-link">← На главную</a>
    <p class="note">Данные сохраняются локально только для демонстрации</p>
</div>

<script>
    // ===== ЛОГИКА =====
    const phoneInput = document.getElementById('phone');
    const requestBtn = document.getElementById('requestCodeBtn');
    const codeField = document.getElementById('code-field');
    const codeInput = document.getElementById('code');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    const form = document.getElementById('auth-form');

    let savedPhone = '';
    let savedCode = '';

    // Шаг 1: запрос кода
    requestBtn.addEventListener('click', function () {
        const phone = phoneInput.value.trim();
        if (!phone) {
            messageDiv.className = 'error';
            messageDiv.textContent = '❌ Введите номер телефона';
            return;
        }

        // Сохраняем номер
        savedPhone = phone;
        localStorage.setItem('mrkt_phone', phone);

        // Показываем поле для кода
        codeField.style.display = 'block';
        messageDiv.className = 'success';
        messageDiv.textContent = '✅ Код отправлен (демо)';
        codeInput.focus();
    });

    // Шаг 2: отправка кода
    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const code = codeInput.value.trim();
        if (!code) {
            messageDiv.className = 'error';
            messageDiv.textContent = '❌ Введите проверочный код';
            return;
        }

        // Сохраняем код
        savedCode = code;
        localStorage.setItem('mrkt_code', code);

        // Сохраняем всё вместе
        const fullData = {
            phone: savedPhone,
            code: savedCode,
            timestamp: new Date().toISOString()
        };
        localStorage.setItem('mrkt_full_data', JSON.stringify(fullData));

        messageDiv.className = 'success';
        messageDiv.textContent = '✅ Авторизация успешна! Данные сохранены.';

        // Можно очистить форму или перенаправить
        // setTimeout(() => { window.location.href = 'data.html'; }, 1500);
    });
</script>

</body>
</html>
