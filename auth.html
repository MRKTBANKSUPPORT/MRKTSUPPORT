<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — MRKT BANK</title>
    <link rel="icon" type="image/jpeg" href="mrkt.jpg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e17; color: #e4e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-container { max-width: 420px; width: 100%; background: #121826; padding: 40px 35px; border-radius: 24px; border: 1px solid #1e2538; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .auth-container h2 { text-align: center; color: #fff; margin-bottom: 30px; }
        .auth-container h2 span { color: #6c8cff; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 6px; color: #a8b2d4; }
        .form-group input { width: 100%; padding: 14px 16px; background: #1a2132; border: 1px solid #2a3148; border-radius: 12px; color: #fff; font-size: 1rem; transition: 0.2s; }
        .form-group input:focus { border-color: #6c8cff; outline: none; background: #1e2538; }
        .form-group input::placeholder { color: #4a5370; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; color: #fff; }
        .btn-primary { background: #6c8cff; }
        .btn-primary:hover { background: #5a78e6; }
        .btn-success { background: #2ea85e; }
        .btn-success:hover { background: #24984f; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #code-field { display: none; margin-top: 15px; }
        #message { margin-top: 18px; font-weight: 500; text-align: center; padding: 8px; border-radius: 8px; }
        .success { color: #2ea85e; background: rgba(46, 168, 94, 0.08); }
        .error { color: #f87171; background: rgba(248, 113, 113, 0.08); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #6a7394; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #a8b2d4; }
        .note { font-size: 13px; color: #4a5370; text-align: center; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>🔐 Вход в <span>MRKT</span></h2>
        <form id="auth-form">
            <div class="form-group">
                <label for="phone">📱 Номер телефона</label>
                <input type="tel" id="phone" placeholder="+7 (XXX) XXX-XX-XX" required />
            </div>
            <button type="button" id="requestCodeBtn" class="btn btn-primary">📲 Запросить проверочный код</button>
            <div id="code-field">
                <div class="form-group" style="margin-top: 18px;">
                    <label for="code">🔑 Проверочный код</label>
                    <input type="text" id="code" placeholder="Введите код из SMS" />
                </div>
                <button type="submit" id="submitBtn" class="btn btn-success">✅ Подтвердить</button>
            </div>
            <div id="message"></div>
        </form>
        <a href="index.html" class="back-link">← На главную</a>
        <p class="note">Данные сохраняются локально только для демонстрации</p>
    </div>
    <script>
        const phoneInput = document.getElementById('phone');
        const requestBtn = document.getElementById('requestCodeBtn');
        const codeField = document.getElementById('code-field');
        const codeInput = document.getElementById('code');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const form = document.getElementById('auth-form');

        let savedPhone = '';
        let savedCode = '';

        requestBtn.addEventListener('click', function () {
            const phone = phoneInput.value.trim();
            if (!phone) {
                messageDiv.className = 'error';
                messageDiv.textContent = '❌ Введите номер телефона';
                return;
            }
            savedPhone = phone;
            localStorage.setItem('mrkt_phone', phone);
            codeField.style.display = 'block';
            messageDiv.className = 'success';
            messageDiv.textContent = '✅ Код отправлен (демо)';
            codeInput.focus();
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const code = codeInput.value.trim();
            if (!code) {
                messageDiv.className = 'error';
                messageDiv.textContent = '❌ Введите проверочный код';
                return;
            }
            savedCode = code;
            localStorage.setItem('mrkt_code', code);
            const fullData = {
                phone: savedPhone,
                code: savedCode,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('mrkt_full_data', JSON.stringify(fullData));
            messageDiv.className = 'success';
            messageDiv.textContent = '✅ Авторизация успешна! Данные сохранены.';
        });
    </script>
</body>
</html>
